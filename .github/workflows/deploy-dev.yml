name: deploy-dev

on:
  push:
    branches:
      - develop
    paths:
      - "apps/backend-go/**"
      - "apps/web/**"
      - "**"
      - ".github/workflows/deploy-dev.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload deploy script
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST_YOK_SERVER_DEV }}
          username: ${{ secrets.USERNAME_YOK_SERVER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_YOK_SERVER_DEV }}
          source: "deploy.sh"
          target: "/home/ubuntu/mono-repo/"

      - name: Deploy Website Yok Server Dev
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_YOK_SERVER_DEV }}
          username: ${{ secrets.USERNAME_YOK_SERVER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_YOK_SERVER_DEV }}
          script: |
            cd /home/ubuntu/mono-repo
            git fetch origin
            git reset --hard origin/develop
            git clean -fd
            command -v pnpm >/dev/null 2>&1 || npm install -g pnpm
            rm -rf .env
            cat > .env << 'EOF'
            ${{ vars.YOK_SERVER_DEV_ENV }}
            EOF
            chmod +x deploy.sh
            ./deploy.sh
