name: deploy-dev

on:
  push:
    branches:
      - develop
    paths:
      - "apps/**"
      - "packages/**"
      - "deploy.sh"
      - ".github/workflows/deploy-dev.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_YOK_SERVER_DEV }}
          username: ${{ secrets.USERNAME_YOK_SERVER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_YOK_SERVER_DEV }}
          script: |
            set -e
            
            # Go to project
            cd /home/ubuntu/mono-repo || { echo "Project not found"; exit 1; }
            
            # Pull latest
            git fetch origin
            git reset --hard origin/develop
            git clean -fd
            
            # Setup Node
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh" || {
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
              [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            }
            nvm install 20
            nvm use 20
            
            # Setup pnpm
            if ! command -v pnpm >/dev/null 2>&1; then
              curl -fsSL https://get.pnpm.io/install.sh | sh -
            fi
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"
            
            # Clean old node_modules completely
            sudo rm -rf node_modules apps/*/node_modules packages/*/node_modules
            
            # Fix permissions after clean
            sudo chown -R $USER:$USER /home/ubuntu/mono-repo
            
            # Create env
            cat > .env << 'EOF'
            ${{ vars.YOK_SERVER_DEV_ENV }}
            EOF
            
            # Deploy
            chmod +x deploy.sh
            ./deploy.sh
