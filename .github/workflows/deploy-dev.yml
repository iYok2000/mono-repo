name: deploy-dev

on:
  push:
    branches:
      - develop
    paths:
      - "apps/backend-go/**"
      - "apps/web/**"
      - "**"
      - ".github/workflows/deploy-dev.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload deploy script
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST_YOK_SERVER_DEV }}
          username: ${{ secrets.USERNAME_YOK_SERVER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_YOK_SERVER_DEV }}
          source: "deploy.sh"
          target: "/home/ubuntu/mono-repo/"

      - name: Deploy Website Yok Server Dev
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_YOK_SERVER_DEV }}
          username: ${{ secrets.USERNAME_YOK_SERVER_DEV }}
          key: ${{ secrets.SSH_PRIVATE_YOK_SERVER_DEV }}
          script: |
            set -e
            cd /home/ubuntu/mono-repo
            git fetch origin
            git reset --hard origin/develop
            git clean -fd
            if ! command -v node >/dev/null 2>&1; then
              curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.7/install.sh | bash
            fi
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            nvm install 20
            nvm use 20
            if ! command -v pnpm >/dev/null 2>&1; then
              curl -fsSL https://get.pnpm.io/install.sh | sh -
            fi
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME:$PATH"
            sudo chown -R "$USER":"$USER" /home/ubuntu/mono-repo
            sudo rm -rf node_modules apps/*/node_modules packages/*/node_modules packages/*/dist .pnpm-store
            sudo chown -R "$USER":"$USER" /home/ubuntu/mono-repo
            pnpm store prune
            mkdir -p apps/web/node_modules apps/backend-go/node_modules packages/shared-types/node_modules
            rm -rf .env
            cat > .env << 'EOF'
            ${{ vars.YOK_SERVER_DEV_ENV }}
            EOF
            chmod +x deploy.sh
            ./deploy.sh
