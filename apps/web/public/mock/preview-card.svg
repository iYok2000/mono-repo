<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" fill="none" role="img" aria-label="ตัวอย่างการ์ด GyByte NFC">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef6ee"/>
      <stop offset="1" stop-color="#e3eae3"/>
    </linearGradient>
    <linearGradient id="card" x1="300" y1="120" x2="660" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10B981"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="960" height="640" rx="24" fill="url(#bg)"/>

  <!-- Gift card -->
  <g filter="url(#shadow)">
    <rect x="300" y="140" width="360" height="360" rx="28" fill="url(#card)"/>
  </g>

  <!-- Brand mark -->
  <rect x="336" y="176" width="56" height="56" rx="14" fill="#ffffff" fill-opacity="0.9"/>
  <text x="364" y="215" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#059669" text-anchor="middle">G</text>
  <text x="410" y="214" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff">GyByte</text>

  <!-- NFC waves -->
  <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M556 300 a44 44 0 0 1 0 100"/>
    <path d="M576 284 a72 72 0 0 1 0 132"/>
    <path d="M596 268 a100 100 0 0 1 0 164"/>
  </g>

  <!-- Card caption -->
  <text x="340" y="404" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="30" font-weight="700" fill="#ffffff">ของขวัญความทรงจำ</text>
  <text x="340" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="500" fill="#ffffff" fill-opacity="0.9">แตะเพื่อเปิดวิดีโอ &amp; ข้อความ</text>

  <!-- Tag -->
  <rect x="120" y="470" width="180" height="52" rx="26" fill="#ffffff"/>
  <text x="210" y="503" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#059669" text-anchor="middle">NFC + QR สำรอง</text>

  <!-- mock watermark -->
  <text x="820" y="600" font-family="'Geist Mono', ui-monospace, monospace" font-size="16" fill="#6c7a71" text-anchor="end">mock preview</text>
</svg>
